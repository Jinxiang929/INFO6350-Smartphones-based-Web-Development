
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Visitor Monitoring Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #222;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0001;
            min-width: 180px;
        }

        .card h2 {
            margin: 10px 0;
            font-size: 30px;
        }

        .card p {
            color: #666;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        th {
            background: #eef1f5;
        }

        tr:hover {
            background: #f9fafb;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        #status {
            color: #666;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Visitor Monitoring Dashboard</h1>

    <p id="status">Loading visitor data...</p>

    <div class="stats">

        <div class="card">
            <p>Total Visits</p>
            <h2 id="totalVisits">0</h2>
        </div>

        <div class="card">
            <p>Auto Refresh</p>
            <h2>5s</h2>
        </div>

    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>IP Address</th>
                    <th>IP Version</th>
                    <th>Browser</th>
                    <th>OS</th>
                    <th>Device</th>
                    <th>Path</th>
                    <th>Visit Time</th>
                    <th>User-Agent</th>
                </tr>
            </thead>

            <tbody id="visitorTable"></tbody>

        </table>

    </div>

</div>

<script>

    async function loadVisitors() {

        try {

            const response = await fetch(
                "/api/visitors",
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const data = await response.json();

            document.getElementById(
                "totalVisits"
            ).textContent = data.total_visits;

            const table = document.getElementById(
                "visitorTable"
            );

            table.replaceChildren();

            data.visitors.forEach(visitor => {

                const row = document.createElement("tr");

                const fields = [
                    visitor.id,
                    visitor.ip,
                    visitor.ip_version,
                    visitor.browser,
                    visitor.os,
                    visitor.device,
                    visitor.path,
                    visitor.visited_at,
                    visitor.user_agent
                ];

                fields.forEach(value => {

                    const cell = document.createElement("td");

                    // Treat visitor data as text,
                    // not executable HTML.
                    cell.textContent = value ?? "";

                    row.appendChild(cell);

                });

                table.appendChild(row);

            });

            document.getElementById(
                "status"
            ).textContent =
                "Last updated: " +
                new Date().toLocaleTimeString();

        } catch (error) {

            document.getElementById(
                "status"
            ).textContent =
                "Failed to load visitors: " +
                error.message;

        }
    }

    loadVisitors();

    setInterval(loadVisitors, 5000);

</script>

</body>
</html>
